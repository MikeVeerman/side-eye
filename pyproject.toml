[project]
name = "jevwatch"
version = "0.1.0"
description = "Flag externalities in code changes with Jev, on your own machine, source files only."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
jevwatch = "jevwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jevwatch*"]

[tool.pytest.ini_options]
addopts = "-q --cov=jevwatch --cov-report=term-missing --cov-report=html:htmlcov"
testpaths = ["tests"]

[tool.coverage.run]
source = ["jevwatch"]
